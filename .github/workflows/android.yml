name: Android CI

on:
  push:
    branches: [ main, "trae/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 解码签名文件
      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_FILE_BASE64: ${{ secrets.SIGNING_STORE_FILE }}
        run: |
          if [ -n "$SIGNING_STORE_FILE_BASE64" ]; then
            echo "$SIGNING_STORE_FILE_BASE64" | base64 -d > app/release.jks
            echo "✅ Signing key decoded to app/release.jks"
          else
            echo "⚠️ No SIGNING_STORE_FILE secret found"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          # ✅ 统一使用 SIGNING_* 前缀，与 build.gradle.kts 匹配
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
