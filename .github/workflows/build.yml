name: Build Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate signing key
      run: |
        keytool -genkey -v \
          -keystore app/release.jks \
          -alias questionhelper \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass questionhelper \
          -keypass questionhelper \
          -dname "CN=QuestionHelper"

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        STORE_PASSWORD: questionhelper
        KEY_PASSWORD: questionhelper
        KEY_ALIAS: questionhelper

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
