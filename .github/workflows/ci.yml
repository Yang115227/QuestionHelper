name: CI Build

on:
  push:
    branches: [ main, trae/agent-QQOeMZ ]
  pull_request:
    branches: [ main, trae/agent-QQOeMZ ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Paddle Lite native libraries
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a paddle-lite

          URL="https://github.com/PaddlePaddle/Paddle-Lite/releases/download/v2.10/inference_lite_lib.android.armv8.gcc.c++_shared.with_extra.with_cv.tar.gz"

          echo "Downloading from: $URL"
          if ! curl --fail-with-body -L -o paddle-lite.tar.gz "$URL"; then
            echo "ERROR: Failed to download Paddle Lite"
            exit 1
          fi

          echo "Extracting..."
          tar -xzf paddle-lite.tar.gz --strip-components=1 -C paddle-lite

          echo "Copying Paddle Lite files..."
          cp paddle-lite/java/jar/PaddlePredictor.jar app/libs/
          cp paddle-lite/java/so/libpaddle_lite_jni.so app/src/main/jniLibs/arm64-v8a/
          
          # 复制 cxx 共享库
          if [ -f paddle-lite/cxx/lib/libpaddle_light_api_shared.so ]; then
            cp paddle-lite/cxx/lib/libpaddle_light_api_shared.so app/src/main/jniLibs/arm64-v8a/
          fi
          
          # ✅ 关键修复：复制 libc++_shared.so（c++_shared 编译选项必需）
          if [ -f paddle-lite/cxx/lib/libc++_shared.so ]; then
            cp paddle-lite/cxx/lib/libc++_shared.so app/src/main/jniLibs/arm64-v8a/
          elif [ -f paddle-lite/java/so/libc++_shared.so ]; then
            cp paddle-lite/java/so/libc++_shared.so app/src/main/jniLibs/arm64-v8a/
          else
            echo "WARNING: libc++_shared.so not found in downloaded package, searching..."
            find paddle-lite -name "libc++_shared.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \; || true
          fi

          echo "Verifying files in jniLibs:"
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        env:
          STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$STORE_FILE" | base64 -d > app/release.jks
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
