name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Paddle Lite native libraries
        run: |
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a paddle-lite
          curl -L -o paddle-lite.tar.gz \
            https://github.com/PaddlePaddle/Paddle-Lite/releases/download/v2.10/inference_lite_lib.android.armv8.gcc.c++_shared.with_extra.with_cv.tar.gz
          tar -xzf paddle-lite.tar.gz --strip-components=1 -C paddle-lite
          cp paddle-lite/java/jar/PaddlePredictor.jar app/libs/
          cp paddle-lite/java/so/libpaddle_lite_jni.so app/src/main/jniLibs/arm64-v8a/
          cp paddle-lite/cxx/lib/libpaddle_light_api_shared.so app/src/main/jniLibs/arm64-v8a/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
