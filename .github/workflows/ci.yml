name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Paddle Lite native libraries
        run: |
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a paddle-lite
          curl -L -o paddle-lite.tar.gz \
            https://github.com/PaddlePaddle/Paddle-Lite/releases/download/v2.10/inference_lite_lib.android.armv8.gcc.c++_shared.with_extra.with_cv.tar.gz
          tar -xzf paddle-lite.tar.gz --strip-components=1 -C paddle-lite
          cp paddle-lite/java/jar/PaddlePredictor.jar app/libs/
          cp paddle-lite/java/so/libpaddle_lite_jni.so app/src/main/jniLibs/arm64-v8a/
          cp paddle-lite/cxx/lib/libpaddle_light_api_shared.so app/src/main/jniLibs/arm64-v8a/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Debug 构建（默认，无需签名）
      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Release 构建（需要签名，仅手动触发）
      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        env:
          STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # 将 base64 编码的签名文件解码
          echo "$STORE_FILE" | base64 -d > app/release.jks
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
