name: CI Build

on:
  push:
    branches: [ main, trae/agent-QQOeMZ ]
  pull_request:
    branches: [ main, trae/agent-QQOeMZ ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ✅ 不再下载，直接使用仓库中已提交的文件
      - name: Verify Paddle Lite files exist
        run: |
          echo "Checking Paddle Lite files in repository..."
          ls -la app/libs/PaddlePredictor.jar || echo "WARNING: JAR not found"
          ls -la app/src/main/jniLibs/arm64-v8a/ || echo "WARNING: jniLibs not found"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        env:
          STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$STORE_FILE" | base64 -d > app/release.jks
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
